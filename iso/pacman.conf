# iso/pacman.conf — archiso live-environment pacman config (spec §11.2).
# Mirrors the stock archiso layout: local ISO package cache + official repos.
# multilib is intentionally left disabled in the live image.

[options]
HoldPkg     = pacman glibc
# xfercommand = /usr/bin/curl -C - -f -o %u %o
DisableDownloadTimeout
RunFirstHook
UseSyslog
Color
UseDelta 0.7
TotalDB

# Any custom repos should go before the official ones.
#[mylocal]
#Server = file:///home/archiso/packages/x86_64

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# 32-bit packages (Steam, Wine, etc.) — opt-in in the installer, off here.
#[multilib]
#Include = /etc/pacman.d/multilib.db
