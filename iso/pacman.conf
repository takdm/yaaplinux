# iso/pacman.conf — archiso live-environment pacman config (spec §11.2).
# Mirrors the stock archiso layout: official repos only. multilib is disabled
# here and enabled opt-in by the installer (repo_enable_multilib, spec §8.4).

[options]
Architecture = x86_64
HoldPkg     = pacman glibc
Color
UseSyslog
# The live build env: skip signature files, which some mirrors/proxies 404.
# This only affects the ISO's build-time package install, never the target
# system's own pacman.conf (which the installer writes fresh).
SigLevel    = Optional TrustAll

# Any custom repos should go before the official ones.
#[mylocal]
#Server = file:///home/archiso/packages/x86_64

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# 32-bit packages (Steam, Wine, etc.) — opt-in in the installer, off here.
#[multilib]
#Include = /etc/pacman.d/multilib.db
