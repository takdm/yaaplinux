# Live-ISO initramfs hooks (archiso). Without the archiso hooks the initramfs
# cannot find/mount the live rootfs and the ISO drops to an emergency shell on
# every boot. Mirrors configs/releng/airootfs/etc/mkinitcpio.conf.d/archiso.conf.
# PXE hooks (archiso_pxe_*) from releng are intentionally omitted: they require
# mkinitcpio-nfs-utils + nbd in the package list and YaapLinux does not netboot.
HOOKS=(base udev microcode modconf memdisk archiso archiso_loop_mnt block filesystems keyboard)
COMPRESSION="xz"
COMPRESSION_OPTIONS=(-9e)
