# snapper config for the root subvolume — installed to /etc/snapper/configs/root
# by stage 90 (snapper createconfig -r / writes this; this is the reference).
SUBDOMAIN=""
CREATE_NUMBER=10
CREATE_PERIOD=1h
TIMELINE_CREATE=true
TIMELINE_CLEANUP=true
CLEANUP=number
NUMBER_CLEANUP=true
NUMBER_LIMIT=50
NUMBER_LIMIT_IMPORT=0
TIMELINE_LIMIT_HOURLY=10
TIMELINE_LIMIT_DAILY=10
TIMELINE_LIMIT_WEEKLY=0
TIMELINE_LIMIT_MONTHLY=0
TIMELINE_LIMIT_YEARLY=0
EMPTYSNAPSHOTS=true
BACKUP=false
NUM_SNAPSHOTS=true
SYNC_ACL_DEFAULT=false
DEBUG=false
DEBUGFILE=/var/log/snapper-dbg.log
FUSE_SHELL=false
ENABLE_QUOTAS=false
